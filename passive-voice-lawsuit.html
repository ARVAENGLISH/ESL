const $=(s,e=document)=>e.querySelector(s),h=(t,c='',x='')=>{const e=document.createElement(t);e.className=c;e.innerHTML=x;return e},M=$('main'),rnd=a=>[...a].sort(()=>Math.random()-.5),pad=i=>String(i+1).padStart(2,'0')+' · ';

function quiz(b,Q){Q.forEach(([q,o,a,e],i)=>{const d=h('div','q',`<b>${pad(i)}${q}</b>`),r=h('div','row col'),f=h('div','fb');o.forEach((x,j)=>{const k=h('button','btn',x);k.onclick=()=>{if(d.dataset.d)return;if(j==a){k.classList.add('ok');d.dataset.d=1;f.className='fb ok';f.innerHTML='✔ '+e}else{k.classList.add('no');f.className='fb no';f.innerHTML='✘ Not quite — '+e}};r.append(k)});d.append(r,f);b.append(d)})}

if(k=='f'){const I=[...d.querySelectorAll('input')];go=()=>{const ok=I.every((e,j)=>x[j].split('/').some(a=>S(a)==S(e.value)));I.forEach(e=>e.className=ok?'ok':'no');f.className='fb '+(ok?'ok':'no');f.textContent=ok?'✔ Correct!':'✘ Answer: '+x.map(a=>a.split('/').join(' / ')).join(' … ')}}
if(k=='c'){x.forEach((o,j)=>{const z=h('button','btn',o);z.onclick=()=>{if(d.dataset.d)return;d.dataset.d=1;z.classList.add(j==y?'ok':'no');if(j!=y)r.children[y].classList.add('ok');f.className='fb '+(j==y?'ok':'no');f.textContent=j==y?'✔ Correct!':'✘ Correct answer: '+x[y]};r.append(z)})}
if(k=='r'){const A=h('div','ans'),P=h('div','row');rnd(x.split('|')).forEach(w=>{const c=h('button','chip',w);c.onclick=()=>(c.parentNode==P?A:P).append(c);P.append(c)});d.append(A,P);go=()=>{const s=[...A.children].map(c=>c.textContent).join(' '),ok=y.split('/').some(a=>S(a)==S(s));A.className='ans '+(ok?'ok':'no');f.className='fb '+(ok?'ok':'no');f.textContent=ok?'✔ Correct!':'✘ Answer: '+y.split('/')[0]+'.'}}
if(k=='w'){d.append(h('textarea'));go=()=>{f.className='fb ok';f.textContent='✔ Great! Read your sentence aloud to your partner. Remember: BE + V3.'}}
if(go){const c=h('button','btn','Check');c.onclick=go;r.append(c)}d.append(r,f);b.append(d)})}

/* VOCABULARY */
const V=[
['adjective','elderly','older person (a polite word for old)','anciano/a, persona mayor','An elderly woman was burned by hot coffee.'],
['adjective','burned','hurt by something very hot','quemado/a','Stella was badly burned.'],
['verb','to spill','accidentally make a liquid fall','derramar','She spilled the coffee on her lap.','spill – spilled – spilled'],
['noun','a lap','the top part of your legs when you are sitting','regazo','The cup fell onto her lap.'],
['verb','to sue','take someone to court','demandar','She decided to sue the company.','sue – sued – sued'],
['verb','to claim','say that something is true','afirmar / alegar','She claimed the coffee was too hot.','claim – claimed – claimed'],
['noun','the jury','a group of people who decide a court case','jurado','The jury listened to both sides.'],
['verb','awarded','officially given money by a court','concedido / otorgado','The jury awarded her $200,000.','award – awarded – awarded'],
['noun','facts','things that are true','hechos','Always check the facts first.'],
['expression','to file a lawsuit','to officially take someone to court','presentar una demanda','She filed a lawsuit against the company.'],
['verb','to demand','to ask for something strongly or officially','exigir / reclamar','She demanded money for her medical bills.','demand – demanded – demanded'],
['noun','a settlement','an agreement to end a legal dispute without going to trial','acuerdo / conciliación','They reached a settlement.'],
['noun','a trial','a legal process in court where a case is decided','juicio','The trial lasted several days.'],

V.forEach(([t,w,en,es,ex,f])=>{const c=h('button','card '+t),a=`<div class=tag>${t}</div><b style="font-size:1.1rem">${w}</b>`;c.innerHTML=a;
c.onclick=()=>{c.classList.toggle('on');c.innerHTML=c.classList.contains('on')?`<div class=tag>${t}</div><b>${w}</b><div class=fb>${en}</div><div class=fb><i>${ex}</i></div><div class=fb>🇪🇸 ${es}</div>${f?`<div class=fb>${f}</div>`:''}`:a};b.append(c)});

/* WARM-UP */

b=sec('Warm-up','Who is responsible?','Read each situation and discuss with your partner. Who do you think is responsible? Choose an option.');
[['A customer spills a very hot coffee on herself.',['The customer','The restaurant','Both','Nobody']],['A bridge collapses because it was poorly designed.',['The engineer','The construction company','The government','Nobody']],['A roof collapses because it was not properly maintained.',['The owner','The architect','The construction company','Nobody']],['A person gets sick after eating at a restaurant.',['The customer','The restaurant','Both','Nobody']],['A beauty product causes an unexpected severe allergy to a customer.',['The customer','The company','Both','Nobody']]].forEach(([q,o])=>{const d=h('div','q',`<b>${q}</b>`),r=h('div','row');o.forEach(x=>{const k=h('button','btn',x);k.onclick=()=>{[...r.children].forEach(y=>y.classList.remove('on'));k.classList.add('on')};r.append(k)});d.append(r);b.append(d)});

/* LISTENING */

b.append(h('a','btn','▶ Watch on YouTube'));$('a',b).href='https://www.youtube.com/watch?v=pCkL9UlmCOE';$('a',b).target='_blank';$('a',b).rel='noopener';
quiz(b,[['How was Stella Liebeck injured?',['She was hit by a car.','She was severely burned by hot coffee.','She was injured in a restaurant.'],1,'the audio says she “was severely burned when she spilled a cup of McDonald’s coffee in her lap.”'],
['How much was Stella awarded?',['$800','$1 million','$2.9 million'],2,'“…has been awarded $2.9 million after she sued McDonald’s.”'],
['Why was McDonald’s sued?',['The coffee was cold.','The coffee was considered too hot.','The restaurant was closed.'],1,'she sued “claiming their coffee was too hot.”'],
['What was lost as the story was repeated in the media?',['The money','The facts','The lawsuit'],1,'“…one thing was lost. The facts.”'],
['Where was Stella sitting when she was burned?',['In a restaurant','In the driver’s seat','In the passenger seat of a parked car'],2,'she was “sitting in the passenger seat of a parked car when she was burned.”']]);

/* READING */
const fmt=s=>s.replace(/\{(\w+)\|([^|}]*)\|?([^}]*)\}/g,(m,f,x,t)=>`<span class="${[f.includes('v')&&'v',f.includes('p')&&'p',f.includes('t')&&'t'].filter(Boolean).join(' ')}"${f.includes('t')?` tabindex=0 data-t="${t}"`:''}>${x}</span>`);
b=sec('Reading','The McDonald’s Hot Coffee Case','Read the text and hover over the dotted words to see a translation. <span class=v>Orange</span> = today’s vocabulary · <span class=p>Pink</span> = passive voice · <span class=t>dotted</span> = translation.');
const box=h('div','box read');b.append(box);
["In 1992, a famous case involving McDonald’s received a lot of attention from the {t|media|medios de comunicación}. The case {pt|was brought|fue presentado} by Stella Liebeck, a 79-year-old woman. She {pv|was burned} by very hot coffee and later {v|sued} McDonald’s.",
"On February 27, 1992, Stella was sitting in the {t|passenger seat|asiento del copiloto} of a {t|parked|estacionado} car when the coffee accidentally {v|spilled} on her. The coffee {p|was served} at a very high temperature. As a result, Stella suffered {t|serious burns|quemaduras graves}. About 16% of her body {pt|was affected|fue afectado}, and some of the burns were very severe.",
"Stella {pt|was taken|fue llevada} to the hospital, where she stayed for about a week. Her {t|medical bills|facturas médicas} were about $10,000. After the accident, McDonald’s {p|was contacted} by Stella and her family. She asked for help with her medical costs, but she {pt|was offered|le ofrecieron} only $800. The amount {p|was considered} too low, so Stella decided to take the case to court.",
"During the {v|trial}, information about McDonald’s coffee {p|was presented}. It {pt|was shown|se demostró} that other customers {pv|had been burned} by very hot coffee before. Hundreds of {t|complaints|quejas} {p|had been made} over several years. McDonald’s said that its coffee temperature {p|was accepted} in the industry and that the company did not plan to {t|lower|bajar} it.",
"In the end, Stella {pv|was awarded} $200,000 in {t|compensation|compensación}. This amount {pt|was later reduced|fue reducido después} to $160,000 because she had also been responsible for {v|spilling} the coffee. She {pv|was also awarded} $2.7 million in {t|punitive damages|daños punitivos}, but this amount {p|was later reduced} by the judge.",
"The case {p|has been discussed} for many years. However, the real {v|facts} {pt|have often been misunderstood|han sido malinterpretados}. In the media, the story {p|has been presented} in a much simpler way: a woman {v|spilled} coffee, {v|sued} McDonald’s, and won millions of dollars.",
"Today, the case {p|is still used} as an example of {t|public perception|percepción pública}, product safety, and customer responsibility. The story shows that important information {pt|can be lost|puede perderse} when a complicated case {pt|is reduced|se reduce} to a simple {t|headline|titular}."].forEach(p=>box.append(h('p','',fmt(p))));
b.append(h('h3','','Comprehension'));
quiz(b,[['Why was Stella’s first request to McDonald’s not accepted?',['Her medical bills were too low.','The amount offered was considered insufficient.','She did not contact McDonald’s.'],1,'she was offered only $800, and “the amount was considered too low.”'],
['What information was discovered during the trial?',['Many customers had been burned by very hot coffee before.','McDonald’s had stopped selling coffee.','Stella had worked for McDonald’s.'],0,'“Hundreds of complaints had been made over several years.”'],
['Why was Stella’s compensation later reduced?',['She was considered partly responsible.','The jury changed its decision.','She did not have medical bills.'],0,'she “had also been responsible for spilling the coffee.”'],
['How has the case often been presented in the media?',['As a complicated discussion about product safety in the coffee industry.','As a simple story about a woman who spilled coffee and won millions.','As a successful advertising campaign for McDonald’s hot coffee.'],1,'“a woman spilled coffee, sued McDonald’s, and won millions of dollars.”'],
['What lesson is the case often used to illustrate?',['Important facts can be lost when a complicated story is simplified.','Companies should never sell hot drinks.','Customers are always responsible for accidents.'],0,'the text ends by saying information can be lost when a case becomes a simple headline.']]);

b=sec('Vocabulary · In context','Word lab','Words that go together. Click a word on the left, then its partner on the right. When you make a pair, each person says a sentence with it.');
const L=['elderly','hot','coffee','medical','file','take','jury','legal','awarded','severe'],R=['bills','person','burns','a lawsuit','temperature','money','team','case','coffee','to court'],
OK={elderly:['person'],hot:['coffee'],coffee:['temperature'],medical:['bills'],file:['a lawsuit'],take:['to court'],jury:['team','case'],legal:['case','team'],awarded:['money'],severe:['burns']};
const wl=h('div','row'),cl=h('div','row col'),cr=h('div','row col');let sel=null;wl.append(cl,cr);b.append(wl);
L.forEach(l=>{const k=h('button','btn',l);k.onclick=()=>{if(k.disabled)return;sel&&sel.classList.remove('on');sel=k;k.classList.add('on')};cl.append(k)});
R.forEach(r=>{const k=h('button','btn',r);k.onclick=()=>{if(!sel||k.disabled)return;if(OK[sel.textContent].includes(r)){sel.className=k.className='btn ok';sel.disabled=k.disabled=true;sel=null}else{k.classList.add('no');setTimeout(()=>k.classList.remove('no'),600)}};cr.append(k)});
cl.style.marginRight='40px';

b=sec('Vocabulary · In context','Pick the right shade of meaning','Both options look similar. Choose the one that fits the sentence best and read the explanation.');
quiz(b,[['Stella was an ___ woman when the accident happened.',['elderly','old'],0,'<b>old</b> is grammatically correct, but <b>elderly</b> is more polite and formal for an older person.'],
['Stella was badly ___ by the coffee.',['hurt','burned'],1,'<b>hurt</b> is more general. <b>Burned</b> means injured by something very hot.'],
['Stella decided to ___ McDonald’s.',['claim','sue'],1,'<b>Claim</b> means to say something is true. <b>Sue</b> means to take someone to court.'],
['Stella ___ that the coffee was too hot.',['said','claimed'],1,'<b>Said</b> is possible, but <b>claimed</b> fits a legal context: she stated something she believed was true.'],
['The jury ___ Stella $200,000 in compensation.',['gave','awarded'],1,'<b>Gave</b> is general. <b>Awarded</b> is used when money is officially given, especially by a court.'],
['Stella decided to ___ a lawsuit against McDonald’s.',['make','file'],1,'We say <b>file</b> a lawsuit, not “make” one. <b>File</b> means to officially submit a legal case.'],
['The case was decided by a ___ of people.',['jury','group'],0,'A <b>jury</b> is a specific group that listens to a legal case and decides. <b>Group</b> is much more general.'],
['The media did not always show the real ___.',['stories','facts'],1,'A <b>story</b> is a narrative. <b>Facts</b> are things that are actually true.']]);

/* PASSIVE REVIEW */
b=sec('Passive voice · Review','Who does the action?','Look at the sentences. What is important: who does the action, or what happens to the person/thing?');
[['McDonald’s serves the coffee at a very high temperature.','The coffee is served at a very high temperature.'],['The hot coffee burned Stella.','Stella was burned by the hot coffee.'],['The jury awarded Stella $200,000.','Stella was awarded $200,000.'],['The media has misunderstood the case.','The case has been misunderstood by the media.']].forEach(([a,p],i)=>b.append(h('div','pair',`<div>${pad(i)}${a}</div><div style="border-left:3px solid var(--pk)">${p}</div>`)));
const tbl='<table><tr><th>Tense<th>Passive structure<th>Example<tr><td>Simple Present<td>am / is / are + past participle<td>The coffee is served hot.<tr><td>Simple Past<td>was / were + past participle<td>Stella was burned.<tr><td>Present Perfect<td>has / have + been + past participle<td>The case has been misunderstood.</table>';
b.append(h('div','box',`<h3 style="margin:0">Notice the pattern</h3><p>In the passive voice, we focus on the person or thing that <b>receives</b> the action.</p><div class=pair><div><b>ACTIVE</b><br>McDonald’s serves the coffee.</div><div style="border-left:3px solid var(--pk)"><b>PASSIVE</b><br>The coffee is served by McDonald’s.</div></div><p>The object of the active sentence becomes the subject of the passive sentence.</p><h3>The formula</h3><p class=p style="font-size:1.2rem">Subject + BE + Past Participle</p><p>The form of BE changes depending on the tense:</p>${tbl}`));
b.append(h('h3','','Put it into practice'),h('p','sub','Complete each sentence with the correct passive form of the verb in parentheses, then click Check.'));

[['Construction','A door is not closing properly three months after the building was delivered to the client. Who should fix it? Why?','Should the contractor be contacted first?'],['Architecture','A design mistake is discovered after construction has been completed. Who should be responsible for the mistake?','Should the building be modified or should the client accept it?'],['Engineering','A bridge is damaged after only two years of use. Who should pay for the repairs?','Should the bridge have been inspected more carefully?'],['Workplace','A safety problem is reported several times, but nothing is done about it. Who should take responsibility?','What should be done when a reported problem is ignored?']].forEach(([t,q,g],i)=>{const c=h('button','card','');const a=`<div class=tag style="color:var(--ac)">${pad(i)}${t}</div>${q}<div class=fb>Click · go further</div>`;c.innerHTML=a;c.onclick=()=>{c.classList.toggle('on');c.innerHTML=c.classList.contains('on')?a.replace('Click · go further',`<b style="color:var(--lime)">Go further:</b> ${g}`):a};D.append(c)});

['🔴 Red','I want to review how the passive voice works.','var(--no)',()=>[h('h3','','🔴 Red · Repaso + práctica'),h('div','box',`<b>¿Qué es la voz pasiva (Passive Voice)?</b><p>Usamos la voz pasiva cuando queremos destacar lo que le pasa a una persona o cosa, y no quién realiza la acción.</p><p><b>Activa:</b> The engineer inspected the bridge. (El ingeniero inspeccionó el puente.)<br><b>Pasiva:</b> The bridge was inspected by the engineer. (El puente fue inspeccionado por el ingeniero.)</p><p><b>Fórmula:</b> <span class=p>Sujeto + BE + V3 + (by + persona)</span></p><p>V3 es el participio pasado del verbo. El verbo BE cambia según el tiempo verbal:</p><table><tr><th>Tiempo<th>Fórmula<th>Ejemplo<tr><td>Presente simple<td>am / is / are + V3<td>The door is checked.<tr><td>Pasado simple<td>was / were + V3<td>The door was checked.<tr><td>Presente perfecto<td>has / have + been + V3<td>The door has been checked.</table><h3>¿Cuándo la usamos?</h3><p><b>Presente simple:</b> rutinas, procesos y procedimientos. <i>The equipment is checked every day.</i> (El equipo se revisa todos los días.)</p><p><b>Pasado simple:</b> acciones terminadas en el pasado. <i>The roof was repaired last week.</i> (El techo fue reparado la semana pasada.)</p><p><b>Presente perfecto:</b> acciones terminadas que tienen conexión con el presente. <i>The problem has been reported.</i> (El problema ha sido reportado.)</p><p>Podemos usar <b>by</b> para decir quién hizo la acción (<i>The building was designed by the architect</i>), pero <b>by + persona</b> es opcional: se omite cuando no sabemos quién lo hizo o no es importante.</p>`),vt(),h('h3','','Practice · 18 exercises'),RP]]].forEach(([n,d,col,f])=>{const k=h('button','',`${n}<div class=fb style="font-weight:400">${d}</div>`);k.style.borderColor=col;k.onclick=()=>{[...tl.children].forEach(x=>x.classList.remove('on'));k.classList.add('on');T.innerHTML='';f().forEach(x=>Array.isArray(x)?ex(T,x):T.append(x));T.scrollIntoView({behavior:'smooth'})};tl.append(
