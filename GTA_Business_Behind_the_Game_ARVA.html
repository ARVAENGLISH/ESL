<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA: The Business Behind the Game · ARVA by Kat</title>
<style>
:root{
  --ink:#0b0612;
  --night:#140a24;
  --panel:#1d1030;
  --indigo:#4F46E5;
  --pink:#FF2D55;
  --orange:#FF751F;
  --cream:#FEFFD2;
  --white:#FFFFFF;
  --soft:#252525;
  --green:#2BD96B;
  --yellow:#FFD23F;
  --red:#FF3B3B;
  --cyan:#36E2FF;
  --head:Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--body);color:var(--cream);background:var(--ink);
  background-image:
    radial-gradient(circle at 20% 0%,rgba(79,70,229,.35),transparent 45%),
    radial-gradient(circle at 90% 10%,rgba(255,45,85,.25),transparent 40%),
    linear-gradient(180deg,#140a24 0%,#0b0612 70%);
  background-attachment:fixed;
  line-height:1.55;overflow-x:hidden;
}
/* halftone overlay */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.07;
  background-image:radial-gradient(#fff 1px,transparent 1.4px);background-size:6px 6px}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- headings ---------- */
.gta-title{
  font-family:var(--head);text-transform:uppercase;letter-spacing:.02em;line-height:.92;
  color:var(--white);-webkit-text-stroke:2px #000;paint-order:stroke fill;
  text-shadow:4px 4px 0 #000,6px 6px 0 var(--pink);
}
.label{font-family:var(--head);text-transform:uppercase;letter-spacing:.08em;font-size:.95rem;color:var(--orange)}

/* ---------- HUD ---------- */
#hud{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:rgba(11,6,18,.92);border-bottom:3px solid #000;
  box-shadow:0 3px 0 var(--pink);backdrop-filter:blur(6px)
}
#hud .brand{font-family:var(--head);font-size:1.15rem;color:var(--white);letter-spacing:.04em;-webkit-text-stroke:1px #000;text-shadow:2px 2px 0 var(--pink)}
#hud .stat{display:flex;align-items:center;gap:6px;font-family:var(--head);font-size:1.1rem;letter-spacing:.05em}
#hud .stat .v{color:var(--green);text-shadow:2px 2px 0 #000}
#hud .stat .lv{color:var(--yellow);text-shadow:2px 2px 0 #000}
.progress-wrap{flex:1;min-width:160px}
.progress-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:#cbb8ff;margin-bottom:3px}
.progress{height:14px;border:2px solid #000;background:#2c1846;box-shadow:2px 2px 0 #000;overflow:hidden}
.progress>div{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--orange) 0 10px,var(--pink) 10px 20px);transition:width .6s ease}
.hud-btn{border:2px solid #000;background:var(--indigo);color:#fff;font-family:var(--head);letter-spacing:.06em;padding:6px 12px;box-shadow:3px 3px 0 #000;font-size:.95rem;text-transform:uppercase}
.hud-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #000}
.hud-btn.alt{background:var(--soft)}

/* ---------- layout ---------- */
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:22px 16px 90px}
.screen{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.panel{
  background:linear-gradient(180deg,#22123a,#170c29);border:3px solid #000;
  box-shadow:6px 6px 0 #000,0 0 0 1px rgba(255,255,255,.04) inset;padding:22px;margin-bottom:20px;position:relative
}
.panel.cream{background:var(--cream);color:var(--soft)}
.mission-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.mission-head .num{font-family:var(--head);font-size:1rem;letter-spacing:.2em;color:var(--orange);text-shadow:2px 2px 0 #000}
.mission-head h2{font-size:clamp(2rem,6vw,3.4rem)}
.badge{display:inline-block;font-family:var(--head);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid #000;padding:3px 10px;box-shadow:2px 2px 0 #000;background:var(--yellow);color:#000}
.badge.pink{background:var(--pink);color:#fff}.badge.indigo{background:var(--indigo);color:#fff}.badge.green{background:var(--green);color:#000}.badge.orange{background:var(--orange);color:#000}
.intro{font-size:1.05rem;color:#e9defc;margin-bottom:6px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:3px solid #000;background:var(--orange);color:#000;font-family:var(--head);
  font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;padding:10px 18px;
  box-shadow:4px 4px 0 #000;transition:transform .08s,box-shadow .08s
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.pink{background:var(--pink);color:#fff}
.btn.indigo{background:var(--indigo);color:#fff}
.btn.green{background:var(--green)}
.btn.dark{background:var(--soft);color:var(--cream)}
.btn.small{font-size:.92rem;padding:6px 12px;box-shadow:3px 3px 0 #000}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{height:14px}
.speak{border:2px solid #000;background:var(--cyan);color:#000;width:34px;height:34px;border-radius:50%;font-size:1rem;box-shadow:2px 2px 0 #000;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.speak:hover{transform:scale(1.08)}

/* ---------- title screen ---------- */
#title-screen{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center}
.title-card{
  position:relative;width:100%;border:4px solid #000;box-shadow:10px 10px 0 #000;overflow:hidden;
  background:#2a0845;min-height:540px;display:flex;flex-direction:column;justify-content:flex-end
}
.title-card .bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;filter:saturate(1.15)}
.title-card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,36,.15) 0%,rgba(20,10,36,.55) 45%,rgba(11,6,18,.97) 100%)}
.title-card .content{position:relative;padding:28px}
.title-card .kicker{font-family:var(--head);letter-spacing:.3em;color:var(--cream);font-size:1rem;text-shadow:2px 2px 0 #000}
.big-logo{font-size:clamp(3.2rem,12vw,7.5rem);margin:6px 0 4px;transform:rotate(-2deg);transform-origin:left}
.big-logo .l2{display:block;font-size:.42em;color:var(--cream);text-shadow:3px 3px 0 #000,5px 5px 0 var(--indigo)}
.title-card .meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.press{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.sig{position:fixed;right:12px;bottom:10px;z-index:40;font-size:.72rem;letter-spacing:.08em;color:#cbb8ff;background:rgba(11,6,18,.75);border:1px solid #3a2560;padding:4px 10px;border-radius:999px}
.sig b{color:var(--pink)}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:200;background:#0b0612;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
#loading .gta-title{font-size:clamp(2.2rem,8vw,4.5rem)}
#loading .tip{max-width:560px;color:#e9defc;font-size:1.05rem;border-left:4px solid var(--orange);padding-left:12px;text-align:left}
.loadbar{width:min(420px,80vw);height:12px;border:2px solid #fff;padding:2px}
.loadbar>div{height:100%;width:0;background:var(--pink);animation:load 1.5s ease forwards}
@keyframes load{to{width:100%}}
.spinner{width:46px;height:46px;border:5px solid #333;border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:78px;right:14px;z-index:300;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:320px}
.toast{background:#0b0612;border:3px solid #000;box-shadow:4px 4px 0 var(--pink);padding:10px 14px;animation:slideIn .35s ease both;color:var(--cream)}
.toast .t{font-family:var(--head);letter-spacing:.06em;font-size:1.05rem;color:var(--yellow);text-transform:uppercase}
.toast.ach{box-shadow:4px 4px 0 var(--yellow);border-color:var(--yellow)}
.toast.lvl{box-shadow:4px 4px 0 var(--cyan)}
.toast.lvl .t{color:var(--cyan)}
.toast.out{animation:slideOut .35s ease forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}
.xp-float{position:fixed;z-index:310;font-family:var(--head);font-size:1.6rem;color:var(--green);-webkit-text-stroke:1px #000;text-shadow:2px 2px 0 #000;pointer-events:none;animation:floatUp 1.1s ease forwards}
@keyframes floatUp{to{opacity:0;transform:translateY(-60px)}}

/* ---------- mission passed overlay ---------- */
#passed{position:fixed;inset:0;z-index:250;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:20px}
#passed .box{text-align:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
#passed h3{font-size:clamp(3rem,11vw,6rem);color:var(--yellow);text-shadow:4px 4px 0 #000,7px 7px 0 var(--orange)}
#passed p{font-family:var(--head);font-size:1.6rem;letter-spacing:.1em;color:#fff;text-shadow:2px 2px 0 #000}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* ---------- map ---------- */
#map{position:fixed;inset:0;z-index:220;background:rgba(11,6,18,.96);display:flex;align-items:center;justify-content:center;padding:20px}
#map .inner{width:min(640px,100%)}
.map-list{display:grid;gap:10px;margin:18px 0}
.map-item{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid #000;background:#22123a;color:var(--cream);padding:12px 14px;box-shadow:4px 4px 0 #000;font-size:1rem}
.map-item .n{font-family:var(--head);font-size:1.4rem;color:var(--orange);min-width:44px}
.map-item .d{font-size:.8rem;color:#bba6e6}
.map-item.done{background:#173a2a}
.map-item.done .n{color:var(--green)}
.map-item:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000}

/* ---------- speaking cards ---------- */
.q-card{
  background:var(--cream);color:var(--soft);border:3px solid #000;box-shadow:6px 6px 0 var(--indigo);
  padding:24px;position:relative;min-height:160px
}
.q-card .qn{font-family:var(--head);color:var(--pink);letter-spacing:.12em;font-size:1rem}
.q-card .qtext{font-size:clamp(1.35rem,3.6vw,1.9rem);font-weight:800;line-height:1.25;margin:8px 0 6px;color:#1a1033}
.q-card .sub{font-size:1.1rem;font-weight:700;color:#3d2a6b;margin-top:6px}
.q-card .tag{position:absolute;top:-14px;right:14px}
.helpbox{margin-top:14px;background:#fff;border:2px dashed #4F46E5;padding:12px 14px;color:#24164a}
.helpbox h4{font-family:var(--head);letter-spacing:.06em;color:var(--indigo);font-weight:400;font-size:1.05rem;margin-bottom:4px}
.helpbox ul{padding-left:18px}
.helpbox li{margin:3px 0}
.followups{margin-top:14px}
.followup{background:#1a1033;color:var(--cream);border-left:6px solid var(--orange);padding:10px 14px;margin-top:8px;font-weight:600;animation:fadeUp .35s both}
.reward-row{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.reward-row .btn{font-size:1rem}
.dots{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.dot{width:30px;height:30px;border:2px solid #000;background:#2c1846;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:.9rem;color:#9d88c9;box-shadow:2px 2px 0 #000}
.dot.on{background:var(--orange);color:#000}
.dot.done{background:var(--green);color:#000}
.timer{font-family:var(--head);font-size:1.3rem;color:var(--pink);min-width:56px;display:inline-block}

/* ---------- vocab ---------- */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.vcard{perspective:900px;height:230px;cursor:pointer}
.vcard .inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.vcard.flipped .inner{transform:rotateY(180deg)}
.vface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:14px;display:flex;flex-direction:column}
.vfront{background:linear-gradient(160deg,var(--indigo),#2a1b8f);color:#fff;justify-content:space-between}
.vfront .vn{font-family:var(--head);font-size:.9rem;color:var(--yellow);letter-spacing:.1em}
.vfront .vw{font-family:var(--head);font-size:2.1rem;letter-spacing:.03em;text-shadow:3px 3px 0 #000;line-height:1}
.vfront .hint{font-size:.78rem;opacity:.8}
.vback{background:var(--cream);color:var(--soft);transform:rotateY(180deg);font-size:.88rem;gap:6px;overflow:auto}
.vback .vw2{font-family:var(--head);font-size:1.3rem;color:var(--pink);display:flex;justify-content:space-between;align-items:center}
.vback .def{font-weight:700;color:#1a1033}
.vback .ex{font-style:italic;color:#3d2a6b;border-left:3px solid var(--orange);padding-left:8px}
.vback .es{font-size:.82rem;color:#555}
.vback .es b{color:var(--indigo)}
.vcard.seen .vfront::after{content:"✓";position:absolute;top:8px;right:10px;background:var(--green);color:#000;border:2px solid #000;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem}

/* ---------- quiz options ---------- */
.mc{background:#fff;color:var(--soft);border:3px solid #000;box-shadow:5px 5px 0 #000;padding:18px;margin-bottom:16px}
.mc .q{font-weight:800;font-size:1.12rem;margin-bottom:10px;color:#1a1033}
.mc .q .gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--pink);text-align:center;color:var(--pink)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opt{border:2px solid #000;background:var(--cream);color:#1a1033;padding:10px 12px;font-size:1rem;font-weight:700;text-align:left;box-shadow:3px 3px 0 #000}
.opt:hover:not([disabled]){background:#fff3a8}
.opt.right{background:var(--green)}
.opt.wrong{background:#ffb3b3;text-decoration:line-through;opacity:.75}
.opt[disabled]{cursor:default}
.fb{margin-top:10px;padding:10px 12px;border-left:6px solid;font-weight:600;animation:fadeUp .3s both}
.fb.ok{border-color:var(--green);background:#e5fbe9;color:#0e4022}
.fb.no{border-color:var(--red);background:#ffe6e6;color:#6b0f0f}
.mc .tagline{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.mini{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid #000;padding:1px 7px;background:#eee}
.mini.ps{background:#d7d4ff}.mini.sp{background:#ffd9c2}.mini.cw{background:#ffd0dc}
.mini.pos{background:#d2f7dd}.mini.neg{background:#ffe0e0}.mini.q{background:#fff2b3}

/* ---------- reading ---------- */
.article{background:var(--cream);color:#1f1830;border:3px solid #000;box-shadow:8px 8px 0 var(--pink);padding:26px}
.article h3{font-family:var(--head);font-weight:400;font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1;color:#1a1033;letter-spacing:.01em;margin-bottom:6px}
.article .byline{font-size:.8rem;color:#6b5a8e;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px}
.article h4{font-family:var(--head);font-weight:400;letter-spacing:.05em;color:var(--pink);font-size:1.3rem;margin:18px 0 4px;display:flex;align-items:center;gap:8px}
.article p{font-size:1.08rem;margin-bottom:8px}
.article .v{background:#ffe1a8;border-bottom:2px solid var(--orange);font-weight:800;padding:0 3px;cursor:help;position:relative}
.article .v:hover::after,.article .v.show::after{content:attr(data-es);position:absolute;left:50%;bottom:120%;transform:translateX(-50%);background:#1a1033;color:#fff;font-size:.78rem;padding:3px 8px;white-space:nowrap;z-index:5;font-weight:600}
.article .yr{font-family:var(--head);color:var(--indigo);letter-spacing:.04em}
figure{margin:14px 0;border:3px solid #000;box-shadow:5px 5px 0 #000;background:#000}
figure img{display:block;width:100%;height:auto}
figcaption{background:#1a1033;color:var(--cream);font-size:.85rem;padding:8px 12px}
.fact-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.fact{background:#1a1033;color:#fff;border:3px solid #000;padding:12px;text-align:center;box-shadow:4px 4px 0 var(--orange)}
.fact b{display:block;font-family:var(--head);font-size:1.7rem;color:var(--yellow);font-weight:400;letter-spacing:.03em}
.fact span{font-size:.8rem}
.reveal-box{margin-top:10px;background:#1a1033;color:var(--cream);padding:12px 14px;border-left:6px solid var(--cyan);animation:fadeUp .3s both}

/* ---------- translation ---------- */
.tcard{background:var(--cream);color:#1a1033;border:3px solid #000;box-shadow:6px 6px 0 var(--orange);padding:24px;min-height:220px}
.tcard .es{font-size:clamp(1.3rem,3.6vw,1.8rem);font-weight:800;line-height:1.3;margin:10px 0 16px}
.tcard .es::before{content:"🇪🇸 ";font-size:.8em}
.tcard .en{background:#1a1033;color:#fff;padding:14px 16px;font-size:clamp(1.15rem,3vw,1.5rem);font-weight:700;display:flex;gap:12px;align-items:center;justify-content:space-between;animation:fadeUp .3s both}
.tcard .note{margin-top:10px;font-size:.95rem;color:#3d2a6b;background:#fff;border:2px dashed var(--indigo);padding:8px 12px}
.countdown{font-family:var(--head);font-size:1.4rem;color:var(--pink)}

/* ---------- grammar ---------- */
.refresher{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.rcard{border:3px solid #000;box-shadow:5px 5px 0 #000;padding:14px;background:#fff;color:#1a1033}
.rcard h4{font-family:var(--head);font-weight:400;font-size:1.35rem;letter-spacing:.04em;margin-bottom:6px}
.rcard.ps h4{color:var(--indigo)}.rcard.sp h4{color:var(--orange)}.rcard.cw h4{color:var(--pink)}
.rcard .f{font-family:ui-monospace,Consolas,monospace;font-size:.86rem;background:#f2f0ff;padding:4px 6px;margin:4px 0;border-left:3px solid #000}
.rcard .e{font-size:.9rem;font-style:italic;color:#3d2a6b;margin:2px 0 6px 6px}
.lights{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:14px}
.light{border:3px solid #000;box-shadow:5px 5px 0 #000;padding:18px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:1.05rem;text-align:left;background:#1a1033;color:#fff}
.light .bulb{width:52px;height:52px;border-radius:50%;border:3px solid #000;flex-shrink:0;box-shadow:inset -6px -6px 0 rgba(0,0,0,.25)}
.light.g .bulb{background:var(--green)}.light.y .bulb{background:var(--yellow)}.light.r .bulb{background:var(--red)}
.light small{display:block;font-weight:500;opacity:.8;font-size:.85rem}
.light:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #000}
.light.g:hover{box-shadow:7px 7px 0 var(--green)}.light.y:hover{box-shadow:7px 7px 0 var(--yellow)}.light.r:hover{box-shadow:7px 7px 0 var(--red)}
.scorebar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-family:var(--head);letter-spacing:.06em;font-size:1.2rem;margin-bottom:14px}
.scorebar .s{background:#000;padding:4px 12px;border:2px solid var(--green);color:var(--green)}

/* ---------- final ---------- */
.final-hero{text-align:center;padding:20px 0}
.final-hero h2{font-size:clamp(2.4rem,9vw,5rem);color:var(--yellow);text-shadow:4px 4px 0 #000,7px 7px 0 var(--pink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.stat-card{background:#1a1033;border:3px solid #000;box-shadow:5px 5px 0 var(--indigo);padding:14px;text-align:center}
.stat-card b{display:block;font-family:var(--head);font-weight:400;font-size:2.3rem;color:var(--green);text-shadow:2px 2px 0 #000}
.stat-card span{font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;color:#cbb8ff}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ach{border:3px solid #000;padding:14px;background:#221a2e;color:#776a8f;box-shadow:4px 4px 0 #000;display:flex;gap:12px;align-items:center}
.ach .ic{font-size:2rem;filter:grayscale(1);opacity:.5}
.ach b{font-family:var(--head);font-weight:400;font-size:1.2rem;letter-spacing:.05em;display:block}
.ach small{font-size:.82rem}
.ach.on{background:linear-gradient(135deg,#3a1a00,#5a2a00);color:var(--cream);box-shadow:4px 4px 0 var(--yellow)}
.ach.on .ic{filter:none;opacity:1}
.ach.on b{color:var(--yellow)}
.report{background:var(--cream);color:#1a1033;border:3px solid #000;box-shadow:6px 6px 0 var(--orange);padding:20px}
.report h4{font-family:var(--head);font-weight:400;color:var(--pink);font-size:1.4rem;letter-spacing:.04em;margin-bottom:6px}
.report li{margin:6px 0 6px 18px}
.closing{text-align:center;padding:26px 16px;border:3px solid #000;background:linear-gradient(135deg,var(--indigo),var(--pink) 60%,var(--orange));box-shadow:8px 8px 0 #000;margin-top:20px}
.closing .gta-title{font-size:clamp(1.8rem,6vw,3rem)}
.closing p{font-size:1.1rem;font-weight:700;color:#fff;margin-top:10px;text-shadow:1px 1px 0 #000}

@media (max-width:640px){
  #hud{gap:8px;padding:8px 10px}
  #hud .brand{display:none}
  #hud .stat{font-size:.95rem}
  .hud-btn{padding:5px 8px;font-size:.8rem}
  .progress-wrap{order:10;flex-basis:100%}
  .panel,.article,.q-card,.tcard{padding:16px}
  .title-card{min-height:480px}
  .vcard{height:240px}
  #toasts{top:auto;bottom:46px;right:8px;left:8px;max-width:none}
  .sig{font-size:.65rem}
}
</style>
</head>
<body>

<!-- ================= HUD ================= -->
<header id="hud" class="hidden">
  <div class="brand">THE BUSINESS BEHIND THE GAME</div>
  <div class="stat">XP <span class="v" id="xp">0</span></div>
  <div class="stat">LV <span class="lv" id="lvl">1</span></div>
  <div class="progress-wrap">
    <div class="progress-label" id="prog-label">Mission 0 / 6</div>
    <div class="progress"><div id="prog"></div></div>
  </div>
  <button class="hud-btn" onclick="openMap()">🗺 Map</button>
  <button class="hud-btn alt" onclick="restartGame()">↻ Restart</button>
</header>

<main id="app"></main>

<div id="toasts"></div>
<div class="sig">✨ <b>ARVA</b> by Kat · Making Fluency Fun!</div>

<!-- ================= LOADING ================= -->
<div id="loading" class="hidden">
  <div class="spinner"></div>
  <div class="gta-title" id="load-title">MISSION 01</div>
  <div class="label" id="load-sub">Loading...</div>
  <div class="loadbar"><div></div></div>
  <div class="tip" id="load-tip"></div>
</div>

<!-- ================= MISSION PASSED ================= -->
<div id="passed" class="hidden">
  <div class="box">
    <h3 class="gta-title">MISSION PASSED!</h3>
    <p id="passed-sub">+50 XP</p>
  </div>
</div>

<!-- ================= MAP ================= -->
<div id="map" class="hidden">
  <div class="inner">
    <div class="row" style="justify-content:space-between">
      <h2 class="gta-title" style="font-size:2.4rem">MISSION MAP</h2>
      <button class="btn small dark" onclick="closeMap()">✕ Close</button>
    </div>
    <div class="map-list" id="map-list"></div>
  </div>
</div>

/* ---------------- SPEECH ---------------- */
const Speech = {
  ok: typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined",
  voice: null,
  init(){
    if(!this.ok) return;
    const pick = () => {
      try{
        const vs = speechSynthesis.getVoices() || [];
        this.voice = vs.find(v => v.lang === "en-US" && /Google|Samantha|Aria|Jenny|Guy|Microsoft/i.test(v.name))
                  || vs.find(v => v.lang === "en-US")
                  || vs.find(v => /^en/i.test(v.lang)) || null;
      }catch(e){}
    };
    pick();
    try{ speechSynthesis.onvoiceschanged = pick; }catch(e){}
  },
  say(text){
    if(!this.ok){ toast("🔇 Audio not available","Your browser has no speech. Keep going!"); return; }
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = .9;
      if(this.voice) u.voice = this.voice;
      speechSynthesis.speak(u);
    }catch(e){}
  }
};
Speech.init();
function speakBtn(text){
  const safe = String(text).replace(/"/g,"&quot;");
  return `<button class="speak" title="Listen" data-say="${safe}" onclick="event.stopPropagation();Speech.say(this.dataset.say)">🔊</button>`;
}

/* ---------------- STATE ---------------- */
const LEVEL_STEP = 150;
let S;
function freshState(){
  return {
    xp:0, level:1, mission:0,
    done:{}, // mission index -> true
    vocabSeen:new Set(), vocabCorrect:0, vocabTotal:0, vocabAnswered:{},
    readCorrect:0, readTotal:0,
    speakAnswers:0, speakBonus:0, hypoBonus:0, pastBonus:0,
    trGot:0, trTotal:0, trPastGot:0, trCWGot:0, trSeen:{},
    gLevel:null, gCorrect:0, gTotal:0, gTagCorrect:{ps:0,sp:0,cw:0}, gTagTotal:{ps:0,sp:0,cw:0},
    achievements:new Set()
  };
}
S = freshState();

/* ---------------- UI HELPERS ---------------- */
const $ = s => document.querySelector(s);
const app = $("#app");

function toast(title,msg,cls=""){
  const t = document.createElement("div");
  t.className = "toast " + cls;
  t.innerHTML = `<div class="t">${title}</div><div>${msg||""}</div>`;
  $("#toasts").appendChild(t);
  setTimeout(()=>t.classList.add("out"),2800);
  setTimeout(()=>t.remove(),3200);
}
function floatXP(n,evt){
  const f = document.createElement("div");
  f.className = "xp-float";
  f.textContent = "+" + n + " XP";
  let x = window.innerWidth/2, y = window.innerHeight/2;
  if(evt && evt.clientX){ x = evt.clientX; y = evt.clientY; }
  f.style.left = (x-40)+"px"; f.style.top = (y-20)+"px";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),1100);
}
function addXP(n,evt){
  S.xp += n;
  floatXP(n,evt);
  const newLevel = Math.floor(S.xp / LEVEL_STEP) + 1;
  if(newLevel > S.level){
    S.level = newLevel;
    toast("⬆ LEVEL UP!","You are now Level "+S.level+". Keep talking!","lvl");
  }
  updateHUD();
}
function updateHUD(){
  $("#xp").textContent = S.xp;
  $("#lvl").textContent = S.level;
  const d = Object.keys(S.done).length;
  $("#prog").style.width = (d/6*100)+"%";
  $("#prog-label").textContent = "Missions completed: " + d + " / 6";
}
function unlock(key){
  if(S.achievements.has(key)) return;
  S.achievements.add(key);
  const a = ACHIEVEMENTS.find(x=>x.key===key);
  toast("🏆 ACHIEVEMENT UNLOCKED", `<b>${a.name}</b> — ${a.desc}`,"ach");
}
function checkAchievements(){
  if(S.vocabTotal>=4 && S.vocabCorrect/S.vocabTotal>=.8) unlock("business");
  const pastScore = S.gTagCorrect.sp + S.trPastGot + S.pastBonus;
  if(pastScore>=5) unlock("time");
  const ceo = S.hypoBonus + S.gTagCorrect.cw + S.trCWGot;
  if(ceo>=4) unlock("ceo");
  if(S.gTotal>=5 && S.gCorrect/S.gTotal>=.8) unlock("grammar");
}
function showLoading(title,sub,tip){
  return new Promise(res=>{
    $("#load-title").textContent = title;
    $("#load-sub").textContent = sub;
    $("#load-tip").innerHTML = "💡 <b>TIP:</b> " + tip;
    const bar = $("#loading .loadbar div");
    bar.style.animation="none"; void bar.offsetWidth; bar.style.animation="";
    $("#loading").classList.remove("hidden");
    setTimeout(()=>{ $("#loading").classList.add("hidden"); res(); },1600);
  });
}
function missionPassed(idx,bonus){
  return new Promise(res=>{
    const first = !S.done[idx];
    S.done[idx] = true;
    if(first) S.xp += bonus;
    const nl = Math.floor(S.xp/LEVEL_STEP)+1;
    if(nl>S.level){ S.level=nl; setTimeout(()=>toast("⬆ LEVEL UP!","You are now Level "+S.level+"!","lvl"),900); }
    updateHUD();
    $("#passed-sub").textContent = first ? ("+"+bonus+" XP  ·  RESPECT +") : "Mission replayed";
    $("#passed").classList.remove("hidden");
    checkAchievements();
    setTimeout(()=>{ $("#passed").classList.add("hidden"); res(); },1900);
  });
}
function scrollTop(){ window.scrollTo({top:0,behavior:"smooth"}); }

/* generic multiple choice */
function mcHTML(prefix,i,q,opts,tags){
  const tagHTML = tags.length? `<div class="tagline">${tags.map(t=>`<span class="mini ${t.c}">${t.t}</span>`).join("")}</div>` : "";
  const qq = q.replace("___",'<span class="gap">___</span>');
  return `<div class="mc" id="${prefix}mc${i}">
    ${tagHTML}
    <div class="q">${i+1}. ${qq}</div>
    <div class="opts">${opts.map((o,j)=>`<button class="opt" onclick="answerMC('${prefix}',${i},${j},event)">${o}</button>`).join("")}</div>
    <div class="fbwrap"></div>
  </div>`;
}
function answerMC(prefix,i,j,e){
  if(prefix==="v") return answerVocab(i,j,e);
  if(prefix==="r") return answerRead(i,j,e);
  if(prefix==="g") return answerGrammar(i,j,e);
}
function setMCFeedback(box,ok,text){
  box.querySelector(".fbwrap").innerHTML = `<div class="fb ${ok?'ok':'no'}">${ok?'✅ Correct! ':'❌ Not yet. '}${text}${ok?'':' <b>Try again!</b>'}</div>`;
}
function answerVocab(i,j,e){
  const x = VQUIZ[i], box = document.getElementById("vmc"+i), btns = box.querySelectorAll(".opt");
  const first = S.vocabAnswered[i]===undefined;
  if(j===x.a){
    btns[j].classList.add("right"); btns.forEach(b=>b.disabled=true);
    setMCFeedback(box,true,x.why);
    if(first){ S.vocabAnswered[i]=true; S.vocabTotal++; S.vocabCorrect++; addXP(15,e); }
    else if(S.vocabAnswered[i]===false){ S.vocabAnswered[i]="fixed"; addXP(5,e); }
    checkAchievements();
  } else {
    btns[j].classList.add("wrong"); btns[j].disabled=true;
    box.querySelector(".fbwrap").innerHTML = `<div class="fb no">❌ Not yet. “${x.o[j]}” doesn't fit here. Read the sentence again. <b>Try again!</b></div>`;
    if(first){ S.vocabAnswered[i]=false; S.vocabTotal++; }
  }
}
function restoreMC(prefix,i,x){
  const box = document.getElementById(prefix+"mc"+i);
  if(!box) return;
  const btns = box.querySelectorAll(".opt");
  btns[x.a].classList.add("right"); btns.forEach(b=>b.disabled=true);
  box.querySelector(".fbwrap").innerHTML = `<div class="fb ok">✅ ${x.why}</div>`;
}

    if(first) gState[i]=false;
  }
  $("#gScore").textContent = S.gCorrect+" / "+G_SET.length;
  checkAchievements();
}

/* =========================================================
   FINAL – CEO DEBRIEF
   ========================================================= */
function renderFinal(){
  checkAchievements();
  $("#hud").classList.remove("hidden");
  updateHUD();
  const gPct = S.gTotal? Math.round(S.gCorrect/S.gTotal*100) : 0;
  const vPct = S.vocabTotal? Math.round(S.vocabCorrect/S.vocabTotal*100) : 0;
  const report = buildReport(gPct,vPct);
  const finals = ["What did you learn about the video game industry today?","Would you invest in a video game company? Why?","If you were the CEO of Rockstar Games, what would you change?"];
  app.innerHTML = `<section class="screen">
    <div class="final-hero">
      <div class="label">FINAL MISSION · CEO DEBRIEF</div>
      <h2 class="gta-title">YOU COMPLETED THE MISSION!</h2>
    </div>
    <div class="stats">
      <div class="stat-card"><b>${S.xp}</b><span>Total XP · Level ${S.level}</span></div>
      <div class="stat-card"><b>${S.gCorrect}/${G_SET.length||S.gTotal||0}</b><span>Grammar correct (1st try)</span></div>
      <div class="stat-card"><b>${S.vocabCorrect}/${VQUIZ.length}</b><span>Vocabulary check</span></div>
      <div class="stat-card"><b>${S.vocabSeen.size}/12</b><span>Toolkit words unlocked</span></div>
      <div class="stat-card"><b>${S.speakAnswers}</b><span>Speaking answers</span></div>
      <div class="stat-card"><b>${S.trGot}/${TR.length}</b><span>Translations correct</span></div>
    </div>

    <div class="panel">
      <div class="label">🏆 Achievements</div><div class="spacer"></div>
      <div class="ach-grid">${ACHIEVEMENTS.map(a=>`
        <div class="ach ${S.achievements.has(a.key)?'on':''}"><span class="ic">${a.icon}</span><span><b>${a.name}</b><small>${S.achievements.has(a.key)?a.desc:'🔒 Locked · '+a.desc}</small></span></div>`).join("")}
      </div>
    </div>

    <div class="report">
      <h4>📋 YOUR LEARNING REPORT</h4>
      <ul>${report.map(r=>`<li>${r}</li>`).join("")}</ul>
    </div>
    <div class="spacer"></div><div class="spacer"></div>

    <div class="panel">
      <div class="label">🎤 Last talk – the CEO interview</div><div class="spacer"></div>
      ${finals.map((q,i)=>`
        <div class="q-card" style="margin-bottom:16px;min-height:auto">
          <div class="qn">QUESTION ${i+1} / 3</div>
          <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="qtext" style="font-size:1.35rem">${q}</div>${speakBtn(q)}</div>
          <div class="reward-row" id="fq${i}"><button class="btn small green" onclick="finalAns(${i},event)">⭐ I answered (+25)</button></div>
        </div>`).join("")}
    </div>

    <div class="closing">
      <div class="gta-title">WELL PLAYED, CEO! ✨</div>
      <p>You read about a billion-dollar industry, talked like a business analyst, and made decisions in English.<br>
      That's not a game — that's real fluency in progress. 🦜✌</p>
      <p style="font-size:.95rem;opacity:.95">ARVA by Kat · Making Fluency Fun!</p>
      <div class="spacer"></div>
      <button class="btn dark" onclick="restartGame()">↻ Play again</button>
    </div>
  </section>`;
  scrollTop();
}
function finalAns(i,e){
  addXP(25,e); S.speakAnswers++;
  if(i>0) S.hypoBonus++;
  $("#fq"+i).innerHTML = `<span class="badge green">✓ +25 XP</span>`;
  checkAchievements();
  // refresh achievements visuals without full re-render
  document.querySelectorAll(".ach").forEach((el,k)=>{
    const a = ACHIEVEMENTS[k];
    if(S.achievements.has(a.key) && !el.classList.contains("on")){
      el.classList.add("on"); el.querySelector("small").textContent = a.desc;
    }
  });
  document.querySelector(".stat-card b").textContent = S.xp;
}
function buildReport(gPct,vPct){
  const r = [];
  r.push(S.speakAnswers>=10
    ? `🎙 <b>Speaking:</b> you answered ${S.speakAnswers} questions. You gave your opinions and reasons — that's the most important skill today.`
    : `🎙 <b>Speaking:</b> you answered ${S.speakAnswers} questions. Next time, try to add one more sentence with <i>because</i>.`);
  if(S.vocabTotal) r.push(vPct>=80
    ? `💼 <b>Vocabulary:</b> ${vPct}% on the toolkit check. Words like <i>revenue, profit, investment</i> are now part of your business English.`
    : `💼 <b>Vocabulary:</b> ${vPct}% on the toolkit check. Review the difference between <i>revenue</i> (all the money) and <i>profit</i> (money after costs).`);
  if(S.gTotal){
    const t = S.gTagTotal, c = S.gTagCorrect;
    const weak = [];
    if(t.ps && c.ps/t.ps<.75) weak.push("Present Simple with he/she/it (makes, doesn't make, does…?)");
    if(t.sp && c.sp/t.sp<.75) weak.push("Simple Past after did / didn't (didn't sell, did buy…?)");
    if(t.cw && c.cw/t.cw<.75) weak.push("could / would + base verb (would invest, could sell)");
    r.push(`🧠 <b>Grammar:</b> ${gPct}% correct on the first try (${S.gLevel.toUpperCase()} level).` + (weak.length? ` Practice more: ${weak.join("; ")}.` : ` Very strong control of the three structures!`));
  } else r.push(`🧠 <b>Grammar:</b> choose a traffic light in Mission 06 to get your grammar score.`);
  if(S.trTotal) r.push(`🔁 <b>Translation:</b> ${S.trGot}/${S.trTotal} correct. Remember: <i>ganar dinero</i> = <b>make</b> money.`);
  r.push(S.hypoBonus>=3
    ? `🕶 <b>Business thinking:</b> great hypothetical answers with <i>would</i> and <i>could</i>. You think like an investor.`
    : `🕶 <b>Business thinking:</b> keep practicing “If I had…, I would…” to talk about investments and decisions.`);
  r.push(`🎯 <b>Next goal:</b> explain the business model of one company you like in 5 sentences (Present Simple) and tell its history (Simple Past).`);
  return r;
}

/* =========================================================
   RESTART
   ========================================================= */
function restartGame(){
  if(!confirmRestart()) return;
  clearInterval(m4timer); clearInterval(trTimer);
  try{ if(Speech.ok) speechSynthesis.cancel(); }catch(e){}
  S = freshState(); gState = {}; m4done = {}; G_SET = [];
  for(const k in readState) delete readState[k];
  updateHUD();
  renderTitle();
  scrollTop();
}
let restartArmed = false, restartTimer = null;
function confirmRestart(){
  // two-click confirm (no browser dialogs)
  if(S.xp===0 && !Object.keys(S.done).length) return true;
  if(restartArmed){ restartArmed=false; clearTimeout(restartTimer); return true; }
  restartArmed = true;
  toast("↻ Restart?","Click Restart again to start a new game.");
  restartTimer = setTimeout(()=>restartArmed=false,3000);
  return false;
}

/* ---------------- BOOT ---------------- */
renderTitle();
</script>
</body>
</html>
